<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KSP Trajectories</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="layout" id="layout">
      <button
        id="panel-toggle"
        class="panel-toggle"
        type="button"
        aria-controls="settings-panel"
        aria-expanded="true"
        aria-label="Ukryj panel ustawień"
        title="Ukryj panel ustawień"
      >
        ◀
      </button>
      <aside class="panel" id="settings-panel">
        <h1>KSP Trajectories</h1>
        <div class="panel-section">
          <div class="section-header">
            <span>Bieżący czas</span>
            <button id="time-parts-toggle" type="button">Uprość do sekund</button>
          </div>
          <label id="current-time-seconds-field">
            Czas [s]
            <input id="current-time" type="number" min="0" step="1" value="0" />
          </label>
          <label class="time-mode">
            <input id="time-ut-mode" type="checkbox" />
            Tryb UT (czas 0 gry = Rok 0, Dzień 0)
          </label>
          <div id="time-parts-fields" class="time-group">
            <label><span>Y:</span><input id="current-years" type="number" min="0" step="1" value="0" /></label>
            <label><span>D:</span><input id="current-days" type="number" min="0" step="1" value="0" /></label>
            <label><span>H:</span><input id="current-hours" type="number" min="0" step="1" value="0" /></label>
            <label><span>m:</span><input id="current-minutes" type="number" min="0" step="1" value="0" /></label>
            <label><span>s:</span><input id="current-seconds" type="number" min="0" step="1" value="0" /></label>
          </div>
        </div>

        <div class="panel-section">
          <div class="section-header">
            <span>Odtwarzanie</span>
            <button id="rate-parts-toggle" type="button">Uprość do sekund</button>
          </div>
          <button id="time-play-toggle" type="button">Play</button>
          <p>Prędkość animacji (na 1 sekundę czasu rzeczywistego):</p>
          <label id="rate-time-seconds-field">
            Prędkość [s/s]
            <input id="rate-time" type="number" min="0" step="1" value="1" />
          </label>
          <div id="rate-parts-fields" class="time-group speed-group">
            <label><span>Y:</span><input id="rate-years" type="number" min="0" step="1" value="0" /></label>
            <label><span>D:</span><input id="rate-days" type="number" min="0" step="1" value="0" /></label>
            <label><span>H:</span><input id="rate-hours" type="number" min="0" step="1" value="0" /></label>
            <label><span>m:</span><input id="rate-minutes" type="number" min="0" step="1" value="0" /></label>
            <label><span>s:</span><input id="rate-seconds" type="number" min="0" step="1" value="1" /></label>
          </div>
        </div>

        <div class="panel-section">
          <h2>Widoczność</h2>
          <div class="toggles">
            <label><input id="show-orbits" type="checkbox" checked /> Pokaż orbity</label>
            <label><input id="show-labels" type="checkbox" checked /> Pokaż nazwy</label>
            <label><input id="show-soi" type="checkbox" /> Pokaż SOI</label>
          </div>
        </div>

        <div class="panel-section">
          <p class="hint">Podwójne kliknięcie na planetę lub księżyc ustawia fokus kamery.</p>
        </div>
      </aside>

      <main class="viewport-wrap">
        <div id="viewport"></div>
        <div id="labels"></div>
      </main>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
