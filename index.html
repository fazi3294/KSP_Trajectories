<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KSP Trajectories</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="layout">
      <aside class="panel">
        <h1>KSP Trajectories</h1>
        <label>
          Bieżący czas [s]
          <input id="current-time" type="number" min="0" step="1" value="0" />
        </label>
        <label class="time-mode">
          <input id="time-ut-mode" type="checkbox" />
          Tryb UT (czas 0 gry = Rok 1, Dzień 1)
        </label>
        <div class="time-grid">
          <label>
            Rok
            <input id="current-years" type="number" min="0" step="1" value="0" />
          </label>
          <label>
            Dzień
            <input id="current-days" type="number" min="0" step="1" value="0" />
          </label>
          <label>
            Godzina
            <input id="current-hours" type="number" min="0" step="1" value="0" />
          </label>
          <label>
            Minuta
            <input id="current-minutes" type="number" min="0" step="1" value="0" />
          </label>
          <label>
            Sekunda
            <input id="current-seconds" type="number" min="0" step="1" value="0" />
          </label>
        </div>
        <div class="playback">
          <button id="time-play-toggle" type="button">Play</button>
          <p>Prędkość (na 1 sekundę czasu rzeczywistego):</p>
          <div class="time-grid speed-grid">
            <label>
              Lata
              <input id="rate-years" type="number" min="0" step="1" value="0" />
            </label>
            <label>
              Dni
              <input id="rate-days" type="number" min="0" step="1" value="0" />
            </label>
            <label>
              Godziny
              <input id="rate-hours" type="number" min="0" step="1" value="0" />
            </label>
            <label>
              Minuty
              <input id="rate-minutes" type="number" min="0" step="1" value="0" />
            </label>
            <label>
              Sekundy
              <input id="rate-seconds" type="number" min="0" step="1" value="1" />
            </label>
          </div>
        </div>

        <div class="toggles">
          <label><input id="show-orbits" type="checkbox" checked /> Pokaż orbity</label>
          <label><input id="show-labels" type="checkbox" checked /> Pokaż nazwy</label>
          <label><input id="show-soi" type="checkbox" /> Pokaż SOI</label>
        </div>

        <h2>Transfer</h2>
        <label>
          Start
          <select id="origin"></select>
        </label>
        <label>
          Cel
          <select id="destination"></select>
        </label>
        <label>
          Czas opuszczenia SOI [s]
          <input id="departure-time" type="number" min="0" step="1000" value="0" />
        </label>
        <label>
          Czas osiągnięcia SOI celu [s]
          <input id="arrival-time" type="number" min="0" step="1000" value="5000000" />
        </label>
        <p id="transfer-summary"></p>
        <p class="hint">
          Podwójne kliknięcie na planetę lub księżyc ustawia fokus kamery.
        </p>
      </aside>

      <main class="viewport-wrap">
        <div id="viewport"></div>
        <div id="labels"></div>
      </main>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
  </html>
